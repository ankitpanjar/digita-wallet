services:
  mysql:
    image: mysql:8.0
    container_name: wallet-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-digital_wallet}
    ports:
      - "3306:3306"
    volumes:
      - wallet_mysql_data:/var/lib/mysql

volumes:
  wallet_mysql_data:
